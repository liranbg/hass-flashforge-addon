---
name: FlashForge WebUI
slug: flashforge_webui
description: "FlashForge WebUI for Home Assistant ingress"
url: "https://github.com/liranbg/hass-flashforge-addon"
version: "0.1.3"
image: "ghcr.io/liranbg/hass-flashforge-addon/{arch}"
startup: services
init: false
arch:
  - amd64
  - aarch64

ingress: true
ingress_port: 3000
ingress_stream: true
panel_icon: mdi:printer-3d
panel_title: FlashForge WebUI

ports: {}
ports_description: {}

options:
  no_printers: true
  last_used: false
  all_saved_printers: false
  webui_password: ""
schema:
  no_printers: bool
  last_used: bool
  all_saved_printers: bool
  webui_password: password

backup_exclude:
  - "*.log"
