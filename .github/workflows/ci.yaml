name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate add-on metadata
        run: python3 tests/validate_metadata.py

      - name: Check ingress adapter syntax
        run: |
          node --check flashforge/ingress-adapter.js
          node --check flashforge-dev/ingress-adapter.js

      - name: Lint shell scripts
        run: shellcheck flashforge/run.sh flashforge-dev/run.sh tests/*.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: flashforge/Dockerfile

      - name: Lint experimental Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: flashforge-dev/Dockerfile

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: flashforge
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - addon: flashforge
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - addon: flashforge-dev
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - addon: flashforge-dev
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract base image
        id: base
        run: |
          image=$(grep -E "^  ${{ matrix.arch }}:" ${{ matrix.addon }}/build.yaml | awk '{print $2}')
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (${{ matrix.addon }}, ${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.addon }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: hass-flashforge-addon:ci-${{ matrix.addon }}-${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (${{ matrix.addon }}, ${{ matrix.arch }})
        run: bash tests/smoke.sh hass-flashforge-addon:ci-${{ matrix.addon }}-${{ matrix.arch }}
