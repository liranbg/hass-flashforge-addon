name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 or 0.2.0-dev
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/liranbg/hass-flashforge-addon

jobs:
  build-and-push:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: flashforge
            image-suffix: ""
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - addon: flashforge
            image-suffix: ""
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - addon: flashforge-dev
            image-suffix: /dev
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - addon: flashforge-dev
            image-suffix: /dev
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          addon_version="$(cat ${{ matrix.addon }}/VERSION)"
          if [ "$version" = "$addon_version" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.matches == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.version.outputs.matches == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image
        if: steps.version.outputs.matches == 'true'
        id: base
        run: |
          image=$(grep -E "^  ${{ matrix.arch }}:" ${{ matrix.addon }}/build.yaml | awk '{print $2}')
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.addon }}, ${{ matrix.arch }})
        if: steps.version.outputs.matches == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.addon }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE }}${{ matrix.image-suffix }}/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}${{ matrix.image-suffix }}/${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          addon=""
          for candidate in flashforge flashforge-dev; do
            if [ "$version" = "$(cat "$candidate/VERSION")" ]; then
              addon="$candidate"
              break
            fi
          done
          test -n "$addon"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "addon=$addon" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ADDON: ${{ steps.version.outputs.addon }}
        run: |
          notes=$(mktemp)
          sed -n "/^## $VERSION$/,/^## /p" "$ADDON/CHANGELOG.md" | sed '${/^## /d;}' > "$notes"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file "$notes" --title "$VERSION"
          else
            gh release create "v$VERSION" --title "$VERSION" --notes-file "$notes"
          fi
